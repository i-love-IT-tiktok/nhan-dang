<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HQL_ Nhận Dạng</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Import MediaPipe Tasks Vision từ CDN -->
    <script type="module">
        import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
        window.MediaPipe = { FilesetResolver, HandLandmarker };
    </script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1 class="glow-text">HQL_ Nhận Dạng</h1>
            <p class="subtitle">MediaPipe Hand Landmarker • Real-time Gesture</p>
        </header>

        <!-- Main Camera Area -->
        <main class="camera-wrapper">
            <div class="video-container" id="videoContainer">
                <video id="webcam" autoplay playsinline muted></video>
                <!-- Canvas cho hiệu ứng hạt (nằm dưới) -->
                <canvas id="fxCanvas" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; transform: scaleX(-1);"></canvas>
                <!-- Canvas cho landmarks (nằm trên) -->
                <canvas id="overlayCanvas" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; transform: scaleX(-1);"></canvas>

                <!-- Status Overlay -->
                <div class="status-overlay">
                    <div class="status-badge" id="camStatus">Camera: Tắt</div>
                    <div class="status-badge" id="fpsDisplay">FPS: 0</div>
                    <div class="status-badge" id="handCount">Tay: 0</div>
                    <div class="status-badge gesture-badge" id="gestureName">Cử chỉ: --</div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="btnStart" class="btn primary">BẬT CAMERA</button>
                <button id="btnStop" class="btn danger" disabled>TẮT CAMERA</button>
                <button id="btnSwitch" class="btn secondary" disabled>Đổi Camera</button>
                <button id="btnFullscreen" class="btn secondary">Toàn Màn Hình</button>
                <button id="btnToggleFx" class="btn secondary active">Hiệu Ứng: BẬT</button>
            </div>
            <div class="error-msg" id="errorMsg"></div>
        </main>

        <footer class="footer">
            <span>HQL_ Nhận Dạng &copy; 2026</span>
        </footer>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
